<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NovaDM action tree editor</title>
<link rel="stylesheet" href="../styles/editor.css" />
</head>
<body>

<h1 id="page-title">NovaDM action tree editor</h1>

<nav class="tabs" role="tablist" aria-label="Editor sections">
	<button class="tab active" type="button" role="tab" aria-selected="true" data-tab="action-tree">Action tree</button>
	<button class="tab" type="button" role="tab" aria-selected="false" data-tab="scenario-space">Scenario space</button>
</nav>

<main>

	<section id="action-tree" class="tab-panel" role="tabpanel">
		
		<div class="control-row">
			<div class="control-left">
				<span class="layout-label">Tree layout</span>
				<div class="toggle-group" role="group" aria-label="Tree layout">
					<button class="toggle-btn active" type="button" data-layout="directory">Directory</button>
					<button class="toggle-btn" type="button" data-layout="traditional">Traditional</button>
				</div>
			</div>

			<div class="control-right">
				<button id="profile-btn" type="button" class="pill-btn" aria-haspopup="true" aria-expanded="false">
					<span class="pill-btn-label">Create or select profile</span>
				</button>
				<button id="version-btn" type="button" class="pill-btn" aria-haspopup="true" aria-expanded="false">
					<span class="pill-btn-label">Version history</span>
				</button>
			</div>

		</div>

		<div class="viewport-row">

			<div class="viewport-box viewport-tree">
				<div class="viewport-toolbar">
					<button id="zoom-out-btn" type="button" class="btn-icon" aria-label="Zoom out">−</button>
					<span id="zoom-label">100%</span>
					<button id="zoom-in-btn" type="button" class="btn-icon" aria-label="Zoom in">+</button>
					<button id="zoom-reset-btn" type="button" class="btn">Reset zoom</button>
					<button id="load-example-btn" type="button" class="btn">Load example tree</button>
					<button id="clear-tree-btn" type="button" class="btn">Clear tree</button>
				<button id="import-tree-btn" type="button" class="btn">Import tree</button>
				<button id="export-tree-btn" type="button" class="btn">Export tree</button>
				<input id="import-file-input" type="file" hidden />
				</div>
				<div id="tree-viewport-content" class="viewport-content"></div>
			</div>

			<div class="viewport-editor-col">
				<span class="viewport-box-label">Editor panel</span>
				<div class="viewport-box viewport-editor-panel" style="padding:0;">
					<div class="palette">
						<span class="palette-label">Drag onto the tree</span>
						<div class="palette-item" draggable="true" data-new-kind="AND">
							<span class="node-badge neutral">+</span>
							<span>AND node</span>
							<span class="hint">all children</span>
						</div>
						<div class="palette-item" draggable="true" data-new-kind="XOR">
							<span class="node-badge neutral">−</span>
							<span>XOR node</span>
							<span class="hint">one of</span>
						</div>
					</div>
					<div id="editor-form-host"></div>
				</div>
			</div>

			<div class="viewport-popover-layer">
				<div id="profile-flyout" class="flyout" role="dialog" aria-label="Profiles" hidden>
					<div class="flyout-header">
						<div class="flyout-tabs" role="tablist" aria-label="Profile or version">
							<button type="button" class="flyout-tab active" role="tab" aria-selected="true" data-flyout-switch="profile">Profile</button>
							<button type="button" class="flyout-tab" role="tab" aria-selected="false" data-flyout-switch="version">Version</button>
						</div>
						<button type="button" class="flyout-close" data-flyout-close="profile" aria-label="Close">&times;</button>
					</div>
					<div class="flyout-body">
						<div class="flyout-pane" id="profile-pane" role="menu" aria-label="Profiles"></div>
					</div>
				</div>

				<div id="version-flyout" class="flyout" role="dialog" aria-label="Version history" hidden>
					<div class="flyout-header">
						<div class="flyout-tabs" role="tablist" aria-label="Profile or version">
							<button type="button" class="flyout-tab" role="tab" aria-selected="false" data-flyout-switch="profile">Profile</button>
							<button type="button" class="flyout-tab active" role="tab" aria-selected="true" data-flyout-switch="version">Version</button>
						</div>
						<button type="button" class="flyout-close" data-flyout-close="version" aria-label="Close">&times;</button>
					</div>
					<div class="flyout-body">
						<div class="flyout-pane" id="version-pane" role="menu" aria-label="Versions"></div>
					</div>
				</div>
			</div>

		</div>


		<div class="scenario-summary-bar">
			<span class="scenario-summary-label">Scenario space (live)</span>
			<div class="scenario-metrics">
				<span class="metric"><span class="metric-label">Size</span> <span class="metric-value" id="scenario-space-size-value">0</span></span>
				<span class="metric"><span class="metric-label">Cost</span> <span class="metric-value">1.24M €</span></span>
				<span class="metric"><span class="metric-label">CO&#8322;</span> <span class="metric-value">312 t</span></span>
				<span class="metric"><span class="metric-label">Score</span> <span class="metric-value">0.78</span></span>
			</div>
			<button type="button" id="view-full-analysis-btn" class="scenario-summary-link">View full analysis &rarr;</button>
		</div>
	</section>

	<section id="scenario-space" class="tab-panel" role="tabpanel" hidden>
		<div class="placeholder-panel">Scenario space.</div>
	</section>

</main>

<script src="../examples/sample-tree.js"></script>
<script src="../src/model.js"></script>
<script src="../src/parser.js"></script>
<script src="../src/render.js"></script>
<script src="../src/editor-form.js"></script>
<script src="../src/tree-interactions.js"></script>
<script src="../src/tree-io.js"></script>
<script src="../src/popovers.js"></script>
<script src="../src/app.js"></script>

</body>
</html>
