<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" width="520" height="620" role="img"
	aria-labelledby="title">
	<title id="title">UML diagram of the six major concepts in NovaDM and their relationships</title>
	<style>
		.box { fill: #FFFFFF; stroke: #1D1D1F; stroke-width: 1.2; }
		.line { fill: none; stroke: #1D1D1F; stroke-width: 1.2; }
		.diamond { fill: #FFFFFF; stroke: #1D1D1F; stroke-width: 1.2; }
		.name { font: 15px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1D1D1F; text-anchor: middle; }
		.many { font: 12px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1D1D1F; }
		.role { font: italic 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1D1D1F; }
	</style>

	<rect class="box" x="205" y="20" width="110" height="38" rx="6" />
	<text class="name" x="260" y="44">scenario</text>
	<path class="line" d="M260 74 V140" />
	<path class="diamond" d="M260 58 L268 66 L260 74 L252 66 Z" />
	<text class="many" x="272" y="84">0..*</text>
	<text class="many" x="272" y="133">1..*</text>

	<rect class="box" x="200" y="140" width="120" height="38" rx="6" />
	<text class="name" x="260" y="164">alternative</text>
	<path class="line" d="M240 194 V300" />
	<path class="diamond" d="M240 178 L248 186 L240 194 L232 186 Z" />
	<path class="line" d="M280 194 V300" />
	<path class="diamond" d="M280 178 L288 186 L280 194 L272 186 Z" />
	<text class="many" x="222" y="206">1</text>
	<text class="many" x="290" y="206">1</text>
	<text class="role" x="228" y="240" text-anchor="end">scenario_selects</text>
	<text class="role" x="292" y="240">can_choose_from</text>
	<text class="many" x="222" y="292">1</text>
	<text class="many" x="290" y="292">1..*</text>

	<rect class="box" x="205" y="300" width="110" height="38" rx="6" />
	<text class="name" x="260" y="324">action</text>
	<path class="line" d="M189 319 H110 V440" />
	<path class="diamond" d="M205 319 L197 327 L189 319 L197 311 Z" />
	<text class="many" x="160" y="310">0..*</text>
	<text class="many" x="118" y="432">1</text>
	<path class="line" d="M260 354 V440" />
	<path class="diamond" d="M260 338 L268 346 L260 354 L252 346 Z" />
	<text class="many" x="270" y="368">0..*</text>
	<text class="many" x="270" y="432">0..*</text>
	<path class="line" d="M331 319 H410 V440" />
	<path class="diamond" d="M315 319 L323 311 L331 319 L323 327 Z" />
	<text class="many" x="336" y="310">0..*</text>
	<text class="many" x="418" y="432">0..*</text>

	<rect class="box" x="55" y="440" width="110" height="38" rx="6" />
	<text class="name" x="110" y="464">subject</text>
	<rect class="box" x="205" y="440" width="110" height="38" rx="6" />
	<text class="name" x="260" y="464">feature</text>
	<rect class="box" x="355" y="440" width="110" height="38" rx="6" />
	<text class="name" x="410" y="464">approach</text>

	<path class="line" d="M110 478 V510 H410 V478 M260 478 V542" />
	<path class="diamond" d="M248 542 H272 L260 560 Z" />
	<rect class="box" x="205" y="560" width="110" height="38" rx="6" />
	<text class="name" x="260" y="584">aspect</text>
</svg>
